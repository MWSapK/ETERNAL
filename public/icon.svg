<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#060911"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer background circle with border -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.4"/>

  <!-- Neural Network Mesh Backdrop -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.25">
    <line x1="256" y1="90" x2="140" y2="180"/>
    <line x1="256" y1="90" x2="372" y2="180"/>
    <line x1="140" y1="180" x2="256" y2="256"/>
    <line x1="372" y1="180" x2="256" y2="256"/>
    <line x1="140" y1="180" x2="140" y2="350"/>
    <line x1="372" y1="180" x2="372" y2="350"/>
    <line x1="140" y1="350" x2="256" y2="420"/>
    <line x1="372" y1="350" x2="256" y2="420"/>
    <line x1="256" y1="256" x2="256" y2="420"/>
  </g>

  <!-- Stylized M Monogram -->
  <path d="M 120 370 L 120 160 L 256 290 L 392 160 L 392 370 L 340 370 L 340 240 L 256 320 L 172 240 L 172 370 Z" 
        fill="url(#metalGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Central Hexagonal Neural Node for "Ai" -->
  <polygon points="256,210 292,230 292,272 256,292 220,272 220,230" 
           fill="#0f172a" 
           stroke="url(#goldGrad)" 
           stroke-width="3.5"/>

  <!-- Ai Typography inside Hexagon -->
  <text x="256" y="260" 
        text-anchor="middle" 
        dominant-baseline="central" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-weight="800" 
        font-size="28" 
        fill="url(#goldGrad)" 
        letter-spacing="1">Ai</text>

  <!-- Node Dots with Gold Halo -->
  <circle cx="256" cy="210" r="5" fill="#fbbf24"/>
  <circle cx="292" cy="230" r="5" fill="#fbbf24"/>
  <circle cx="292" cy="272" r="5" fill="#fbbf24"/>
  <circle cx="256" cy="292" r="5" fill="#fbbf24"/>
  <circle cx="220" cy="272" r="5" fill="#fbbf24"/>
  <circle cx="220" cy="230" r="5" fill="#fbbf24"/>

  <!-- Subtitle Text -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-weight="700" 
        font-size="22" 
        fill="#f8fafc" 
        letter-spacing="2">MrMWSK's Ai</text>
  <text x="256" y="470" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', system-ui, sans-serif" 
        font-weight="500" 
        font-size="11" 
        fill="#94a3b8" 
        letter-spacing="4">OFFLINE INTELLIGENCE</text>
</svg>
