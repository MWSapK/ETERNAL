    <!-- Prevent Vite HMR WebSocket connection errors in sandbox iframe environment -->
    <script>
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const NativeWebSocket = window.WebSocket;
          class MockHmrSocket extends EventTarget {
            constructor(url, protocols) {
              super();
              this.url = String(url);
              this.protocols = protocols;
              this.readyState = 1; // WebSocket.OPEN
              this.OPEN = 1;
              this.CONNECTING = 0;
              this.CLOSING = 2;
              this.CLOSED = 3;
              setTimeout(() => {
                this.dispatchEvent(new Event('open'));
                if (typeof this.onopen === 'function') this.onopen(new Event('open'));
              }, 0);
            }
            send() {}
            close() {
              this.readyState = 3;
              this.dispatchEvent(new Event('close'));
              if (typeof this.onclose === 'function') this.onclose(new Event('close'));
            }
          }

          function SafeWebSocket(url, protocols) {
            const isViteHmr =
              protocols === 'vite-hmr' ||
              protocols === 'vite-ping' ||
              (typeof url === 'string' && (url.includes('token=') || url.includes('/@vite/client')));

            if (isViteHmr) {
              return new MockHmrSocket(url, protocols);
            }
            return new NativeWebSocket(url, protocols);
          }

          SafeWebSocket.prototype = NativeWebSocket.prototype;
          SafeWebSocket.OPEN = NativeWebSocket.OPEN ?? 1;
          SafeWebSocket.CONNECTING = NativeWebSocket.CONNECTING ?? 0;
          SafeWebSocket.CLOSING = NativeWebSocket.CLOSING ?? 2;
          SafeWebSocket.CLOSED = NativeWebSocket.CLOSED ?? 3;
          window.WebSocket = SafeWebSocket;
        }

        const origError = console.error;
        console.error = function(...args) {
          if (args.some(a => typeof a === 'string' && (a.includes('WebSocket') || a.includes('[vite]')))) {
            return;
          }
          if (args.some(a => a instanceof Error && (a.message?.includes('WebSocket') || a.stack?.includes('@vite/client')))) {
            return;
          }
          origError.apply(console, args);
        };
        window.addEventListener('error', function(e) {
          if ((e.message && e.message.includes('WebSocket')) || (e.filename && e.filename.includes('@vite/client'))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && (e.reason.message?.includes('WebSocket') || String(e.reason).includes('WebSocket') || (e.reason.stack && e.reason.stack.includes('@vite/client')))) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
